# The single config file for the whole reactor — Spring Boot loads only the
# first application.properties on the classpath, so library modules
# (pms-security, pms-db, pms-messaging, pms-integration, pms-common) must
# never ship one; this is it. Every secret below is env-only with NO default,
# so a missing value fails startup instead of silently falling back to
# whatever used to be hardcoded here. Non-secret tuning may keep a default.

spring.application.name=pms-app

# Used to build env-scoped queue names (matches the Python services'
# convention, e.g. {ENVIRONMENT}.iam.rpc.<name>.queue) and to gate the
# OpenAPI docs the same way the Python services do.
ENVIRONMENT=${ENVIRONMENT:development}

# The PMS API contract is snake_case end to end (cycle_code, period_start, ...);
# this maps every DTO's camelCase Java fields to snake_case JSON without a
# per-class @JsonNaming annotation.

