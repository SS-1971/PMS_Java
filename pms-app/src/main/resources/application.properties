# The single config file for the whole reactor - Spring Boot loads only the
# first application.properties on the classpath, so library modules
# (pms-security, pms-db, pms-integration, pms-common) must
# never ship one; this is it. Secrets are env-only: nothing is hardcoded here.

spring.application.name=pms-app

spring.jackson.property-naming-strategy=SNAKE_CASE

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://bob-dbserver.postgres.database.azure.com:5432/pms_demo
spring.datasource.username=pgadmin
spring.datasource.password=S@g@rs)ft@123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# No migration tool (Flyway/Liquibase) in this project yet, so Hibernate itself
# creates/updates tables from the @Entity classes on boot -- "update" only adds
# what's missing (new tables, new columns), never drops or rewrites existing
# ones, so it's safe to leave on against a shared dev DB with real data in it.
# create_namespaces=true makes it issue `CREATE SCHEMA IF NOT EXISTS pms` too,
# since every PMS @Entity is in schema="pms" (e.g. PmsGoalAssignmentEntity) and
# that schema won't exist on a fresh database otherwise.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
# SQL logging is a local-dev convenience and floods prod logs with query text
# (sometimes carrying PII) -?? off unless explicitly turned on.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- Valkey ---
# Must be the SAME instance and database IAM writes sessions to
# (session:<access_token>) -- point this at IAM's Valkey, not a private one.
# (Single-URL form, kept for reference: rediss://default:<password>@<host>:6379)
#spring.data.redis.host=innocent-honeybee-284868.upstash.io
#spring.data.redis.port=${VALKEY_PORT:6379}
#spring.data.redis.username=${VALKEY_USERNAME:}
#spring.data.redis.password=gQAAAAAABFjEAAIgcDExODUzZWE5MGMxNDU0OWJlYTMwMzA2NDU1NDYzMGE4NQ
#spring.data.redis.database=${VALKEY_DB:0}
#spring.data.redis.ssl.enabled=${VALKEY_SSL_ENABLED:true}

# Office LAN Valkey. `host` must be a bare hostname/IP -- no scheme, no path --
# ValkeyConfig.java passes it straight to RedisStandaloneConfiguration#setHostName,
# which isn't a URL parser; "http://172.16.2.111/" would fail DNS/connect outright.
# ssl defaults to false: this looks like the same kind of plain self-hosted
# instance we hit at this IP before (no TLS, no auth) rather than a managed
# TLS-only service like Upstash -- flip VALKEY_SSL_ENABLED=true if that's wrong.
spring.data.redis.host=172.16.2.111
spring.data.redis.port=${VALKEY_PORT:6479}
spring.data.redis.username=${VALKEY_USERNAME:}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.database=${VALKEY_DB:0}
spring.data.redis.ssl.enabled=${VALKEY_SSL_ENABLED:false}

# --- RabbitMQ ---
# Office LAN broker, not the CloudAMQP instance other Sentrifugo services use --
# this host has no credentials given, so it falls back to RabbitMQ's own
# guest/guest default (which only works for local/same-host connections unless
# the broker's loopback_users config was changed to allow it remotely).
spring.rabbitmq.host=172.16.2.111
spring.rabbitmq.port=${RABBITMQ_PORT:5772}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Must match IAM's own ENVIRONMENT (see Sentrifugo-IAM-Admin-BE/.env) exactly --
# it's the queue-name prefix both sides use ({environment}.{service}.rpc.{procedure}.queue),
# so a mismatch here means PMS calls a queue nobody is listening on and every
# IAM RPC call (direct_reports, permission_check, ...) just times out after
# pms.iam-rpc.reply-timeout-ms with no error on IAM's side at all.
pms.rpc.environment=${ENVIRONMENT:development}
# IAM RPC calls (eligible-employees preview) wait at most this long before the
# caller gets a 503 rather than hanging the request indefinitely.
pms.iam-rpc.reply-timeout-ms=${IAM_RPC_TIMEOUT_MS:8000}
# IAM REST base for reading the employee directory (team lookup). Forwards the caller's token.
pms.iam.base-url=${IAM_BASE_URL:http://localhost:8000}

pms.api.base.path=/api/v1/pms

# Browser origins allowed to call the API (comma-separated). Add the deployed frontend URL in each environment.
pms.cors.allowed-origins=${PMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

