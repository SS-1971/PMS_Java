```properties
# Single configuration file for the entire Maven reactor.
# Library modules (pms-security, pms-db, pms-integration, pms-common)
# must not ship their own application.properties.
# Secrets and environment-specific values are injected at runtime.

spring.application.name=pms-app

spring.jackson.property-naming-strategy=SNAKE_CASE

# --- PostgreSQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- Valkey ---
# Configure these variables to connect to the same Valkey instance as IAM.
spring.data.redis.host=${VALKEY_HOST}
spring.data.redis.port=${VALKEY_PORT:6479}
spring.data.redis.username=${VALKEY_USERNAME:}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.database=${VALKEY_DB:0}
spring.data.redis.ssl.enabled=${VALKEY_SSL_ENABLED:false}

# --- RabbitMQ ---
# RabbitMqConfig reads RABBITMQ_URL directly from the environment.
# Do not define RABBITMQ_URL as a literal property in this file.

# IAM RPC queue environment must match the IAM service configuration.
pms.rpc.environment=${ENVIRONMENT:development}
RABBITMQ_URL=${RABBITMQ_URL}


# IAM RPC timeout in milliseconds.
pms.iam-rpc.reply-timeout-ms=${IAM_RPC_TIMEOUT_MS:8000}

# IAM REST API base URL.

# --- PMS API ---
pms.api.base.path=/api/v1/pms

# --- CORS ---
pms.cors.allowed-origins=${PMS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
```
